[package]
name = "quorid"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Globally unique 128-bit IDs from a replicated, pluggable consensus backend"
license = "Apache-2.0"
repository = "https://github.com/juanmaneo/quorid"

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

# Repository automation follows the cargo-xtask pattern: tasks such as
# `cargo coverage` live in the `xtask` member.
[workspace]
members = ["xtask"]
